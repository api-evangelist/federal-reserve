openapi: 3.0.3
info:
  title: Federal Reserve FRED Category Related Tags API
  description: The FRED API allows developers to retrieve economic data from the Federal Reserve Bank of St. Louis including categories, releases, series, sources, tags, and observations across thousands of economic time series.
  version: '1.0'
  contact:
    name: Federal Reserve Bank of St. Louis
    url: https://fred.stlouisfed.org/docs/api/fred/
servers:
- url: https://api.stlouisfed.org/fred
  description: Production
security:
- ApiKey: []
tags:
- name: Related Tags
paths:
  /related_tags:
    get:
      summary: Get related tags
      operationId: getRelatedTags
      parameters:
      - name: tag_names
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Related tags
      tags:
      - Related Tags
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: query
      name: api_key
