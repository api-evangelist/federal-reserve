naftiko: 1.0.0-alpha2
info:
  label: Federal Reserve FRED API
  description: 'Federal Reserve FRED API. 13 operations. Lead operation: Get a category. Self-contained Naftiko capability
    covering one Federal Reserve business surface.'
  tags:
  - Federal Reserve
  - Federal Reserve FRED API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FEDERAL_RESERVE_API_KEY: FEDERAL_RESERVE_API_KEY
capability:
  consumes:
  - type: http
    namespace: fred
    baseUri: https://api.stlouisfed.org/fred
    description: Federal Reserve FRED API business capability. Self-contained, no shared references.
    resources:
    - name: category
      path: /category
      operations:
      - name: getcategory
        method: GET
        description: Get a category
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: category_id
          in: query
          type: integer
          required: true
    - name: category-children
      path: /category/children
      operations:
      - name: getcategorychildren
        method: GET
        description: Get child categories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: category_id
          in: query
          type: integer
          required: true
    - name: category-series
      path: /category/series
      operations:
      - name: getcategoryseries
        method: GET
        description: Get series in a category
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: category_id
          in: query
          type: integer
          required: true
    - name: related_tags
      path: /related_tags
      operations:
      - name: getrelatedtags
        method: GET
        description: Get related tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tag_names
          in: query
          type: string
          required: true
    - name: release
      path: /release
      operations:
      - name: getrelease
        method: GET
        description: Get a release
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: release_id
          in: query
          type: integer
          required: true
    - name: release-series
      path: /release/series
      operations:
      - name: getreleaseseries
        method: GET
        description: Get series for a release
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: release_id
          in: query
          type: integer
          required: true
    - name: releases
      path: /releases
      operations:
      - name: getreleases
        method: GET
        description: Get all releases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series
      path: /series
      operations:
      - name: getseries
        method: GET
        description: Get a series
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: series_id
          in: query
          type: string
          required: true
    - name: series-observations
      path: /series/observations
      operations:
      - name: getseriesobservations
        method: GET
        description: Get observations for a series
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: series_id
          in: query
          type: string
          required: true
        - name: observation_start
          in: query
          type: string
        - name: observation_end
          in: query
          type: string
    - name: series-search
      path: /series/search
      operations:
      - name: searchseries
        method: GET
        description: Search series by text
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: search_text
          in: query
          type: string
          required: true
    - name: source
      path: /source
      operations:
      - name: getsource
        method: GET
        description: Get a source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: source_id
          in: query
          type: integer
          required: true
    - name: sources
      path: /sources
      operations:
      - name: getsources
        method: GET
        description: Get all sources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: tags
      path: /tags
      operations:
      - name: gettags
        method: GET
        description: Get all tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: api_key
      value: '{{env.FEDERAL_RESERVE_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: fred-rest
    port: 8080
    description: REST adapter for Federal Reserve FRED API. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/category
      name: category
      description: REST surface for category.
      operations:
      - method: GET
        name: getcategory
        description: Get a category
        call: fred.getcategory
        with:
          category_id: rest.category_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/category/children
      name: category-children
      description: REST surface for category-children.
      operations:
      - method: GET
        name: getcategorychildren
        description: Get child categories
        call: fred.getcategorychildren
